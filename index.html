<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drone Far Show - We are the Drone Show Family</title>
    <meta name="description" content="We are the Drone Show Family. Welcome to dronefarshow.com">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cabin:wght@700&family=Lato:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Müasir və Təmiz CSS Stilləri -->
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Lato', sans-serif;
            background-color: #121212;
            color: #f7f7f7;
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1, h2, h3, .brand-font {
            font-family: 'Cabin', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Hero Section */
        .hero {
            position: relative;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://img1.wsimg.com/isteam/ip/c7bd0181-f502-4515-b5f5-bd82d5afebbb/DALL%C2%B7E%202024-11-19%2021.02.05%20-%20A%20captivating%20co.webp') no-repeat center center/cover;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 24px;
        }

        .hero h1 {
            font-size: clamp(32px, 5vw, 56px);
            margin-bottom: 16px;
            color: #ffffff;
            text-shadow: 0px 2px 20px rgba(0, 0, 0, 0.5);
        }

        .hero p {
            font-size: clamp(18px, 2vw, 22px);
            color: #e2e2e2;
            margin-bottom: 32px;
            max-width: 700px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: #8b8be8;
            color: #000000;
            font-weight: 700;
            padding: 14px 32px;
            border-radius: 4px;
            text-decoration: none;
            transition: background-color 0.3s ease, transform 0.2s ease;
            cursor: pointer;
            border: none;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .btn:hover {
            background-color: #a9a9ee;
            transform: translateY(-2px);
        }

        /* Content Sections */
        .section {
            padding: 80px 24px;
            max-width: 1100px;
            margin: 0 auto;
            text-align: center;
        }

        .section h2 {
            font-size: 36px;
            margin-bottom: 24px;
            color: #ffffff;
        }

        .section p {
            color: #b1b1b1;
            font-size: 18px;
            max-width: 800px;
            margin: 0 auto 32px auto;
        }

        /* Footer */
        footer {
            background-color: #0b0b0b;
            padding: 40px 24px;
            text-align: center;
            color: #717171;
            border-top: 1px solid #222;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Hero Bölməsi -->
    <header class="hero">
        <h1>Drone Far Show</h1>
        <p>We are the Drone Show Family</p>
        <a href="#contact" class="btn">Bizimlə Əlaqə</a>
    </header>

    <!-- Haqqımızda Bölməsi -->
    <main>
        <section class="section" id="about">
            <h2>Gələcəyin İşıq Şousu</h2>
            <p>Səmanı sənət əsərinə çeviririk. Müasir dron texnologiyaları və vizual dizaynla tədbirlərinizi unudulmaz edirik.</p>
        </section>
    </main>

    <!-- Footer -->
    <footer id="contact">
        <p>&copy; 2026 dronefarshow.com. Bütün hüquqlar qorunur.</p>
    </footer>

</body>
</html>
